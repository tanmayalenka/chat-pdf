<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatPDF</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="icon" type="image/png" href="/favicon.png">
</head>
<body>
<div class="app">

    <!-- ============ SIDEBAR ============ -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <h1>📚 ChatPDF</h1>
            <p class="subtitle">Local RAG · Ollama · pgvector</p>
        </div>

        <!-- Upload -->
        <div id="dropZone" class="drop-zone">
            <input type="file" id="fileInput" accept="application/pdf" hidden />
            <div class="drop-zone__inner">
                <div class="drop-zone__icon">⬆</div>
                <div class="drop-zone__text">
                    <strong>Click to upload</strong> or drag a PDF here
                </div>
                <div class="drop-zone__hint">Max 50 MB</div>
            </div>
        </div>

        <!-- Upload status -->
        <div id="uploadStatus" class="upload-status hidden"></div>

        <!-- Document list -->
        <div class="doc-list-header">
            <span>Documents</span>
            <button id="refreshDocs" class="icon-btn" title="Refresh">⟳</button>
        </div>
        <ul id="docList" class="doc-list">
            <li class="doc-empty">No documents yet</li>
        </ul>
    </aside>

    <!-- ============ MAIN CHAT ============ -->
    <main class="chat">
        <header class="chat-header">
            <div class="chat-header__left">
                <span id="scopeLabel" class="scope-label">All documents</span>
            </div>
            <div class="chat-header__right">
                <button id="clearChat" class="text-btn">Clear chat</button>
            </div>
        </header>

        <div id="messages" class="messages">
            <div class="welcome">
                <h2>👋 Welcome</h2>
                <p>Upload a PDF on the left, then ask anything about it.</p>
                <p class="muted">Everything runs locally — no data leaves your machine.</p>
            </div>
        </div>

        <form id="chatForm" class="composer">
        <textarea
                id="question"
                placeholder="Ask a question about your documents…"
                rows="1"
                autocomplete="off"
        ></textarea>
            <button id="sendBtn" type="submit">Send</button>
        </form>
    </main>
</div>

<script src="/js/app.js"></script>
</body>
</html>
